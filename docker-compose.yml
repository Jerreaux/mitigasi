services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mitigasi
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/mitigasi
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    restart: unless-stopped
    ports:
      - "7890:3000"
    depends_on:
      - backend
    networks:
      - default
      - dokploy-network

volumes:
  mongo_data:

networks:
  dokploy-network:
    external: true
